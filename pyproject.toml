[project]
name = "intelligent-document-assistant"
version = "0.1.0"
description = "Document question-answering over a PDF using retrieval-augmented generation (work in progress)."
readme = "README.md"
authors = [
    { name = "Abhishek Vinod", email = "abhishekvinod48@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-groq>=1.1.3",
    "llama-index-core>=0.14.25",
    "llama-index-embeddings-huggingface>=0.8.0",
    "pymupdf>=1.28.2",
]

[project.scripts]
intelligent-document-assistant = "intelligent_document_assistant:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
markers = [
    "integration: uses the real embedding model (downloads it on first run); run with -m integration",
]
addopts = "-m 'not integration'"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
